version: '3.8'

services:
  db:
    image: postgres:16
    container_name: weatherpipeline-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: weatherpipeline
    ports:
      - '5435:5432'
    volumes:
      - weather_postgres_data:/var/lib/postgresql/data

volumes:
  weather_postgres_data: